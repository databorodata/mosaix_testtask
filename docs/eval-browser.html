<style>
:root{--bg:#f3f5f7;--card:#fff;--ink:#17212b;--mut:#5d6b79;--line:#d9e1e8;--ok:#187339;--okbg:#e5f6ea;

@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f161d;--card:#18222c;--ink:#e7edf3;
--mut:#93a4b4;--line:#2c3a47;--ok:#5fcb84;--okbg:#0d3a20;--bad:#ff8d85;--badbg:#4b1512;--warn:#f0c06c;

--okbg:#0d3a20;--bad:#ff8d85;--badbg:#4b1512;--warn:#f0c06c;--warnbg:#3a2a05;--info:#6aa5ff;--infobg:#132c52;color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:14.5px/1.5 'IBM Plex Sans',-apple-system,sans-serif;margin:0;
padding-block:26px 60px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:940px;margin:0 auto}
h1{font-size:22px;margin:0 0 4px}.sub{color:var(--mut);margin:0 0 14px;max-width:72ch}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 14px}
.tab{padding:7px 12px;border:1px solid var(--line);border-radius:8px;background:var(--card);cursor:pointer;font-size:13.5px}
.tab.on{background:var(--info);border-color:var(--info);color:#fff}
table{border-collapse:collapse;width:100%;background:var(--card);font-size:13px;margin:0 0 14px}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left}th{font-weight:600}
.flt{margin:0 0 10px;font-size:13px;color:var(--mut)}
.item{background:var(--card);border:1px solid var(--line);border-radius:9px;margin:7px 0;overflow:hidden}
.ihead{display:flex;gap:10px;align-items:center;padding:9px 13px;cursor:pointer;flex-wrap:wrap}
.ihead:hover{background:var(--infobg)}
.qid{font:600 12px var(--mono);color:var(--mut)}
.qtext{font-weight:600;flex:1;min-width:200px}
.v{font-size:12px;padding:2px 9px;border-radius:999px;white-space:nowrap}
.v.ok{background:var(--okbg);color:var(--ok)}.v.bad{background:var(--badbg);color:var(--bad)}
.v.warn{background:var(--warnbg);color:var(--warn)}.v.info{background:var(--infobg);color:var(--info)}
.body{display:none;border-top:1px solid var(--line);padding:11px 13px;font-size:13.5px}
.item.open .body{display:block}
.sec{margin:8px 0 2px;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--mut)}
.hit{padding:6px 9px;border:1px solid var(--line);border-radius:7px;margin:5px 0}
.hit.g{border-color:var(--ok);background:var(--okbg)}
.hit .st{font-size:11.5px;color:var(--mut)}
.m{color:var(--ok)}.d{color:var(--bad)}.n{color:var(--mut)}
.row{font-family:var(--mono);font-size:12px;color:var(--mut)}
.goldtag{font-size:11px;color:var(--ok);font-weight:600}
</style>
