# Правила замен для прототипа.
# ДОПУЩЕНИЕ: настоящие правила задаёт специалист заказчика. Эти три заведены для демонстрации.
# Как поменять: правка этого файла, код не трогаем. Поиск перечитывает файл при запуске.
#
# kinds      — для каких видов изделий действует правило (вид берётся из запроса: первое существительное).
# attribute  — характеристика: section (сечение кабеля), resolution (разрешение камеры, Мп),
#              power_kva (мощность, кВА), power_kw (мощность, кВт), voltage, current, sizes.
# mode       — strict: значение у кандидата совпадает, иначе «не подходит»;
#              steps: допускается отличие на max_steps ступеней ряда steps.

rules:
  - id: cable_section_strict
    title: "Кабель и провод: число жил и сечение совпадают строго"
    kinds: [кабель, провод]
    attribute: section
    mode: strict

  - id: camera_resolution_step
    title: "Видеокамера: разрешение отличается не больше чем на одну ступень"
    kinds: [камера, видеокамера]
    attribute: resolution
    mode: steps
    steps: [1, 1.3, 2, 3, 4, 5, 6, 8, 12]
    max_steps: 1

  - id: transformer_power_strict
    title: "Трансформатор: мощность совпадает строго"
    kinds: [трансформатор]
    attribute: power_kva
    mode: strict
