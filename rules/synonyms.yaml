# Словарь видов изделий для поиска. Правится специалистом, код не трогаем.
# Поиск перечитывает файл при запуске. Проверка после правки:
#   .venv/bin/python -m scripts.attrs_diff      — какие строки базы изменили разбор
#   .venv/bin/python -m scripts.whatchanged     — какие запросы изменили выдачу
#
# abbr: сокращение → полное название вида (раскрывается при разборе запроса и строки).
# kinds: вид → какие ещё слова считать тем же видом (симметрию дописывать не нужно).

abbr:
  ибп: источник бесперебойного питания
  гофра: труба гофрированная
  гофротруба: труба гофрированная
  жби: изделие железобетонное
  кл: клапан

kinds:
  камера: [видеокамера]
  короб: [кабель-канал]
